<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RAG Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e12;
    --panel: #17171d;
    --accent: #ff5a1f;
    --text: #eaeaea;
    --muted: #8a8a95;
    --bubble-user: #ff5a1f;
    --bubble-bot: #1f2027;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    display: flex;
  }
  #sidebar {
    width: 300px;
    background: var(--panel);
    padding: 24px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid #26262e;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 28px;
    color: var(--accent);
    margin: 0 0 4px 0;
  }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  #uploadBox {
    border: 2px dashed #33333d;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: 0.2s;
    font-size: 14px;
    color: var(--muted);
  }
  #uploadBox:hover { border-color: var(--accent); color: var(--text); }
  #fileInput { display: none; }
  #docList { margin-top: 20px; flex: 1; overflow-y: auto; }
  .docItem {
    background: #1c1c23;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--text);
    word-break: break-word;
  }
  #clearBtn {
    background: none;
    border: 1px solid #33333d;
    color: var(--muted);
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
  }
  #clearBtn:hover { border-color: var(--accent); color: var(--accent); }
  #chatPanel { flex: 1; display: flex; flex-direction: column; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 65%; padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 15px; }
  .msg.user { align-self: flex-end; background: var(--bubble-user); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bubble-bot); color: var(--text); border-bottom-left-radius: 4px; }
  .msg ul { margin: 6px 0; padding-left: 20px; }
  .msg p { margin: 6px 0; }
  .msg p:first-child, .msg ul:first-child { margin-top: 0; }
  .msg p:last-child, .msg ul:last-child { margin-bottom: 0; }
  .sources { font-size: 11px; color: var(--muted); margin-top: 6px; }
  #inputBar {
    display: flex;
    gap: 10px;
    padding: 20px 32px;
    border-top: 1px solid #26262e;
    background: var(--panel);
  }
  #questionInput {
    flex: 1;
    background: #1c1c23;
    border: 1px solid #2c2c35;
    color: var(--text);
    padding: 12px 16px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
  }
  #questionInput:focus { border-color: var(--accent); }
  #sendBtn {
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 0 22px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: 700;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  .empty-state { color: var(--muted); text-align: center; margin: auto; font-size: 14px; }
</style>
</head>
<body>

<div id="sidebar">
  <h1>RAG CHATBOT</h1>
  <div class="subtitle">Ask questions about your documents</div>

  <div id="uploadBox" onclick="document.getElementById('fileInput').click()">
    📄 Click to upload PDF / DOCX / TXT
  </div>
  <input type="file" id="fileInput" accept=".pdf,.docx,.txt" onchange="uploadFile(this.files[0])">

  <div id="docList"></div>

  <button id="clearBtn" onclick="clearDocs()">Clear all documents</button>
</div>

<div id="chatPanel">
  <div id="messages">
    <div class="empty-state">Upload a document, then ask a question about it.</div>
  </div>
  <div id="inputBar">
    <input id="questionInput" type="text" placeholder="Ask something about your documents..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
const API = ""; // same origin

async function refreshDocs() {
  const res = await fetch(`${API}/documents`);
  const data = await res.json();
  const list = document.getElementById('docList');
  list.innerHTML = '';
  if (data.documents.length === 0) {
    list.innerHTML = '<div style="color:#666;font-size:12px;">No documents yet</div>';
  } else {
    data.documents.forEach(doc => {
      const div = document.createElement('div');
      div.className = 'docItem';
      div.textContent = doc;
      list.appendChild(div);
    });
  }
}

async function uploadFile(file) {
  if (!file) return;
  const box = document.getElementById('uploadBox');
  box.textContent = `Uploading ${file.name}...`;

  const formData = new FormData();
  formData.append('file', file);

  try {
    const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Upload failed');
    box.textContent = '📄 Click to upload PDF / DOCX / TXT';
    refreshDocs();
  } catch (err) {
    box.textContent = '❌ ' + err.message;
    setTimeout(() => box.textContent = '📄 Click to upload PDF / DOCX / TXT', 2500);
  }
}

async function clearDocs() {
  await fetch(`${API}/documents`, { method: 'DELETE' });
  refreshDocs();
  document.getElementById('messages').innerHTML = '<div class="empty-state">Upload a document, then ask a question about it.</div>';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function formatMarkdown(text) {
  let safe = escapeHtml(text);

  // Bold: **text**
  safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // Split into lines to detect bullet/numbered lists
  const lines = safe.split('\n');
  let html = '';
  let inList = false;

  for (let line of lines) {
    const bulletMatch = line.match(/^\s*[-*]\s+(.*)/);
    const numberedMatch = line.match(/^\s*\d+\.\s+(.*)/);

    if (bulletMatch || numberedMatch) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${bulletMatch ? bulletMatch[1] : numberedMatch[1]}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (line.trim()) html += `<p>${line}</p>`;
    }
  }
  if (inList) html += '</ul>';

  return html;
}

function addMessage(text, sender, sources) {
  const messages = document.getElementById('messages');
  const emptyState = messages.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  const div = document.createElement('div');
  div.className = `msg ${sender}`;
  div.innerHTML = sender === 'bot' ? formatMarkdown(text) : escapeHtml(text);

  if (sources && sources.length) {
    const src = document.createElement('div');
    src.className = 'sources';
    src.textContent = 'Source: ' + sources.join(', ');
    div.appendChild(src);
  }

  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) return;

  addMessage(question, 'user');
  input.value = '';
  document.getElementById('sendBtn').disabled = true;

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Something went wrong');
    addMessage(data.answer, 'bot', data.sources);
  } catch (err) {
    addMessage('⚠️ ' + err.message, 'bot');
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}

refreshDocs();
</script>

</body>
</html>
